<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glenzender-übergang</title>
  
  <!-- Wir binden die moderne Google-Schriftart 'Inter' für die gesamte Website ein -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ALLGEMEINES STYLING DER HAUPTWEBSITE */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;  /* Edler, sehr dunkler Tech-Hintergrund (Slate-900) */
      color: #f8fafc;            
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;         
      overflow: hidden;          /* Verhindert jegliches Scrollen */
      position: relative;
    }

    /* NEU: HINTERGRUND-DESIGN (Abstract Grid & Gradient Blobs) */
    .bg-animation-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      /* Erzeugt ein hochmodernes, dezentes Linien-Gitter im Hintergrund */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Zwei leuchtende Farbkleckse im Hintergrund für den Tiefeneffekt */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px); /* Macht die Farben extrem weich */
      opacity: 0.15;
      animation: blobBewegung 10s infinite alternate ease-in-out;
    }
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 500px;
      height: 500px;
      background-color: #3b82f6; /* Blau */
    }
    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 600px;
      height: 600px;
      background-color: #1d4ed8; /* Dunkelblau */
    }

    @keyframes blobBewegung {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    /* NEU: GLAS-EFFEKT FÜR DIE INHALTS-BOX (Glassmorphism) */
    .content-card {
      background-color: rgba(30, 41, 59, 0.7); /* Teiltransparentes Slate-800 */
      border: 1px solid rgba(255, 255, 255, 0.08); /* Feine Lichtkante */
      backdrop-filter: blur(16px); /* Filtert den Hintergrund weich */
      padding: 48px;
      border-radius: 32px;       
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
      max-width: 600px;
      width: 90%;
      text-align: center;        
      z-index: 2; /* Liegt über dem Gitter-Hintergrund */
    }

    /* ÜBERSCHRIFT */
    .content-card h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;            
      margin-top: 0;
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    /* FLIEẞTEXT */
    .content-card p {
      font-size: 15px;
      line-height: 1.6;          
      color: #94a3b8;            /* Angenehmes Hellgrau */
      margin-bottom: 32px;
    }

    /* NEU: EXTRA INHALT - FEATURES GRID */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 Spalten nebeneinander */
      gap: 16px;
      margin-bottom: 40px;
    }

    .feature-item {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px 12px;
      border-radius: 16px;
      transition: background-color 0.2s;
    }
    .feature-item:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }

    .feature-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .feature-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }

    /* BUTTON DESIGN */
    .moderner-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #2563eb; 
      color: #ffffff;            
      font-family: 'Inter', sans-serif;
      font-size: 16px;           
      font-weight: 600;          
      padding: 16px 36px;        
      border: none;              
      border-radius: 50px;       
      cursor: pointer;           
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease-in-out;
    }

    .moderner-button:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
    }

    .moderner-button img {
      height: 22px;
      width: auto;
    }

    /* EXPANDIERENDER LADEBILDSCHIRM (Ausrichtung von oben) */
    .wellen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;     
      height: 100vh;
      background-color: #1e3a8a; 
      z-index: 9999; 
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      transform: translateY(-100vh);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .wellen-overlay.aktiv {
      transform: translateY(0);
    }

    /* LADE-PUNKTE-HINTERGRUND */
    .punkte-hintergrund {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px);
      background-size: 30px 30px;
      opacity: 0;
    }

    .wellen-overlay.aktiv .punkte-hintergrund {
      animation: punkteLeuchten 3s ease-in-out infinite alternate;
    }

    @keyframes punkteLeuchten {
      0% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(1); }
    }

    /* TEXT-CONTAINER FÜR DIE BUCHSTABEN */
    .lade-text-welle {
      font-family: 'Inter', sans-serif;
      font-size: 54px;         
      font-weight: 700;
      color: #ffffff;
      display: flex;
      z-index: 2;
    }

    .lade-text-welle span {
      display: inline-block;
      transform: translateY(0);
    }

    .wellen-overlay.aktiv .lade-text-welle span {
      animation: buchstabeHuepfen 0.8s ease-in-out infinite;
    }

    @keyframes buchstabeHuepfen {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    /* VERZÖGERUNGEN FÜR DEN WELLEN-EFFEKT */
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(1) { animation-delay: 0.0s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(2) { animation-delay: 0.08s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(3) { animation-delay: 0.16s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(4) { animation-delay: 0.24s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(5) { animation-delay: 0.32s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(6) { animation-delay: 0.40s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(7) { animation-delay: 0.48s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(8) { animation-delay: 0.56s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(9) { animation-delay: 0.64s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(10) { animation-delay: 0.72s; }
    .wellen-overlay.aktiv .lade-text-welle span:nth-child(11) { animation-delay: 0.80s; }
  </style>
</head>
<body>

  <!-- NEU: Das animierte Hintergrund-Gitter mit leuchtenden Kreisen -->
  <div class="bg-animation-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Die professionelle Inhaltskarte mit neuem Glassmorphism-Design -->
  <div class="content-card">
    <h1>Sichere Postkarten-Portale</h1>
    <p>Das Internet bietet unzählige Optionen für digitalen und physischen Postkartenversand. Wir filtern für dich die sichersten Systeme heraus, damit deine Daten geschützt bleiben.</p>

    <!-- NEU: Der erweiterte Inhalt (Feature Kacheln) -->
    <div class="features-grid">
      <div class="feature-item">
        <div class="feature-icon">🛡️</div>
        <div class="feature-title">Geprüfte Sicherheit</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">⚡</div>
        <div class="feature-title">Schneller Versand</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">✨</div>
        <div class="feature-title">Premium Qualität</div>
      </div>
    </div>

    <!-- Der Button-Bereich -->
    <a href="https://www.glenzend.de" target="_blank" rel="noopener" onclick="ladeEffekt(event, this.href)" style="text-decoration: none;">
        <button class="moderner-button">
            <img src="Images/Glenzend.png" alt="Logo">
            glenzend öffnen
        </button>
    </a>
  </div>

  <!-- Der Ladebildschirm (fällt perfekt von oben herab) -->
  <div id="lade-bildschirm" class="wellen-overlay">
    <div class="punkte-hintergrund"></div>
    
    <div class="lade-text-welle">
      <span>g</span><span>l</span><span>e</span><span>n</span><span>z</span><span>e</span><span>n</span><span>d</span><span>.</span><span>d</span><span>e</span>
    </div>
  </div>

  <!-- Skript für das Ein- und Ausblenden -->
  <script>
    function ladeEffekt(event, zielUrl) {
      event.preventDefault(); 
      
      const overlay = document.getElementById('lade-bildschirm');
      
      // 1. Aktiviert den Ladebildschirm von oben nach unten
      overlay.classList.add('aktiv');
      
      // 2. Wartet 2,5 Sekunden und öffnet das Ziel
      setTimeout(function() {
        window.open(zielUrl, 'noopener');
      }, 2500);
      
      // 3. Zieht den Ladebildschirm nach 3,5 Sekunden wieder nach oben weg
      setTimeout(function() {
        overlay.classList.remove('aktiv');
      }, 3500);
    }
  </script>

</body>
</html>
